<nav class="h-full flex flex-col bg-slate-600 basis-64 text-slate-200">
  <ul
    class="flex flex-col gap-y-1 p-4 w-full **:block [&_*]:hover:text-slate-50 [&_*]:hover:font-medium [&_*]:hover:bg-slate-900"
  >
    @for (navLink of navLinks; track navLink.goTo) {
      <li class="border-2 border-slate-100/60">
        <a
          class="w-full"
          [href]="navLink.goTo"
        >
        <span class="text-center">
          {{ navLink.pageName }}
        </span>
        </a>
      </li>
    }
  </ul>
  @defer (when shouldRenderQueryBuilder()) {
    <app-query-builder></app-query-builder>
  }
  <app-theme-toggle class="mt-auto [&>*:w-full] text-center"></app-theme-toggle>
</nav>
